<!doctype html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const theme = localStorage.getItem("orbit-control-theme") ?? "dark";
				document.documentElement.classList.toggle("dark", theme !== "light");
				document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
			} catch {
				document.documentElement.style.colorScheme = "dark";
			}
		</script>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23003366%22/><path d=%22M17 45 30 16h6l12 29h-8l-2-6H27l-3 6zm13-13h6l-3-8z%22 fill=%22white%22/></svg>"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
